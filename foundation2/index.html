<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="color-scheme" content="dark">
 <title>Rally One · Foundation 2 Today</title>
 <link rel="stylesheet" href="design.css">
 <link rel="stylesheet" href="../rallypoint-verseplay.css">
</head>
<body>
 <div class="shell">
  <header class="header">
   <a class="brand" data-route="today" href="./" aria-label="Rally One, Today">
    <img src="../assets/citizen-flag.svg" alt="" width="27" height="27">
    <span>RALLY <em>ONE.</em></span>
   </a>
   <div class="header-actions">
    <button type="button" class="member-help" id="ask-rally" aria-label="Ask Rally">Ask</button>
    <a class="header-connect" data-return-focus="header-connect" data-route="connect" href="?screen=connect" aria-label="Connect · preview route">
     <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H9l-4.5 2 1.1-4.5A7.5 7.5 0 0 1 4 11.5V10a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7Z"/></svg>
    </a>
    <details class="preview-tools" id="preview-tools">
    <summary aria-label="Open demo profile and scenario controls" title="Demo profile and scenarios">
     <span class="preview-avatar" aria-hidden="true">D</span>
    </summary>
    <div class="preview-tools-panel">
     <button type="button" id="member-profile-open">Personalize this demo</button>
     <label for="scenario">Demo scenario</label>
     <select id="scenario">
      <option value="connected">Group + team</option>
      <option value="leader">Leader</option>
      <option value="group">Group member</option>
      <option value="team">Volunteer</option>
      <option value="visitor">Visitor</option>
      <option value="unavailable">Conversation unavailable</option>
      <optgroup label="Planning Center sample">
       <option value="serving-ready">Assigned shift</option>
       <option value="serving-denied">Access denied</option>
       <option value="serving-outage">Provider outage</option>
       <option value="serving-stale">Stale schedule</option>
      </optgroup>
      <optgroup label="Planning Center group sample">
       <option value="group-ready">Group with gathering</option>
       <option value="group-empty">Group with empty calendar</option>
       <option value="group-denied">Group access denied</option>
       <option value="group-outage">Group provider outage</option>
       <option value="group-stale">Stale group data</option>
      </optgroup>
     </select>
     <small>Sample scenarios use fictional data.</small>
    </div>
    </details>
   </div>
  </header>
  <main id="today" tabindex="-1" aria-label="Today"></main>
  <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation"></nav>
  <footer class="preview-footer">
   <span>FOUNDATION 2 · SYNTHETIC PREVIEW · NO LIVE CHURCH DATA</span>
   <a href="../index.html">Open the existing Rally One application <span aria-hidden="true">↗</span></a>
  </footer>
 </div>
 <dialog id="member-dialog" class="member-dialog" aria-label="Member companion and profile"></dialog>
