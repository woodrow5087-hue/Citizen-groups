ton aria-pressed="${r===role}" onclick="switchRole('${r}')">${n}</button>`).join('');let gp=hasGroup()&&!s.group,sp=hasServe()&&!s.serve,all=!gp&&!sp&&role!=='visitor';document.querySelector('#greeting').innerHTML=(role==='visitor'?'Welcome to Citizen':all?'You’re all set':'Good morning')+'<span class="red">.</span>';let top=role==='visitor'?`<section class="tile wide hero"><div class="eyebrow">Find your people</div><h2>Life together.</h2><p>Discover a group at North Campus.</p><div class="actions">${btn(s.interest?'Interest saved':'Explore groups',"openPanel('discover')")}</div></section>`:gp?`<section class="tile wide hero"><div class="eyebrow">Tonight · 6:30 PM</div><h2>Wednesday Group</h2><p>North Commons</p><div class="actions">${btn('I’m going',"respond('group','Going')")}${btn('Maybe',"respond('group','Maybe')",'secondary')}</div></section>`:sp?`<section class="tile wide dark"><div class="eyebrow">Your next step · Sunday</div><h2>Welcome Team · 9 AM</h2><p>Can you serve this week?</p><div class="actions">${btn('Confirm',"respond('serve','Confirmed')")}${btn('Can’t make it',"respond('serve','Declined')",'secondary')}</div></section>`:`<section class="tile wide quiet"><div class="eyebrow red">✓ All set</div><h2 style="font-family:Georgia;font-size:29px">Make room for connection.</h2><p>Nothing needs your response.</p>${btn('Your plans',"openPanel('plans')",'secondary')}</section>`;let care=role==='leader'?`<section class="tile wide leader"><div class="eyebrow red">Leader · optional care</div><h2>${s.care?'Check-in noted':'A moment of care.'}</h2><p>Marcus shared a prayer request.</p>${btn('Review request',"openPanel('care')",'secondary')}</section>`:'';let tiles=(hasServe()&&gp?serve():'')+(hasGroup()?messages():'')+(role==='volunteer'?`<section class="tile community"><div class="eyebrow">Your team</div><h2>Team Room</h2>${btn('Open',"openPanel('room')",'secondary')}</section>`:'')+(role==='visitor'?`<section class="tile wide"><div class="eyebrow red">Your next ation; no sending in this study.</p>'}if(k==='person'){t=names[i];b=`<img src="${faces[i]}" alt="" style="width:100px;border-radius:50%"><p>Wednesday Group · fictional contact</p>`+btn('View group conversation',"openPanel('messages')")}if(k==='read'){t='Love one another.';b='<p>John 15:12 · BSB</p><p>“This is My commandment, that you love one another as I have loved you.”</p>'+btn(s.read?'Done':'Mark reading complete',"s.read=true;render();panel.close()")+'<p class="muted">Reading is always optional.</p>'}if(k==='plans'){t='Your plans';b=(hasGroup()?'<p>Wednesday Group · '+(s.group||'RSVP open')+'</p>'+btn('Change RSVP',"openPanel('group')",'secondary'):'')+(hasServe()?'<p>Welcome Team · '+(s.serve||'Response needed')+'</p>'+btn('Change availability',"openPanel('serve')",'secondary'):'')||'<p>No assigned commitments.</p>'}if(k==='ask'){t='Ask Rally';b='<p>'+(role==='visitor'?'Explore a group or read Scripture at your own pace.':hasGroup()&&!s.group?'Your group RSVP is open.':hasServe()&&!s.serve?'Your serving response is next.':'Your required responses are answered. Optional activities are available.')+'</p>'+btn('Show my plans',"openPanel('plans')")+'<p class="muted">Contextual sample guidance, not live AI.</p>'}if(k==='reset'){t='Try again';b='<p>Reset all fictional responses and unread messages.</p>'+btn('Reset prototype',"s=states[role]=fresh();render();panel.close()")};detail.innerHTML='<h2>'+t+'</h2>'+b;if(!panel.open)panel.showModal()}render();</script></html>
