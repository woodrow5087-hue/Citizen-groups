<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="An unofficial Citizen Groups concept demonstrating a BuddyCheck-inspired daily Bible habit experience.">
  <title>Citizen Groups · Daily Rhythm Demo</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div class="stage">
    <aside class="desktop-pitch" aria-hidden="true">
      <div class="desktop-kicker"><span></span> A CITIZEN GROUPS CONCEPT</div>
      <h1>Grow in faith.<br><em>Together.</em></h1>
      <p>A daily rhythm of Scripture, sharing, memorization and prayer—with a few people who notice when you show up.</p>
      <div class="desktop-tags"><span>Read</span><span>Share</span><span>Memorize</span><span>Pray</span></div>
      <div class="desktop-disclaimer">UNOFFICIAL INTERACTIVE PROTOTYPE · Sample data only</div>
    </aside>
    <div class="phone-shell">
      <div class="phone-camera" aria-hidden="true"></div>
      <div class="app-frame">
        <header class="app-header" id="header">
          <div class="brand" aria-label="Citizen Groups">
            <div class="brand-icon"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 8h26v20H17l-7 7V28H7z" fill="white"/><path d="M26.9 14.1c-1.3-.9-2.5-1.2-4.1-1.2-4.3 0-7.4 3.1-7.4 7.3s3.1 7.3 7.4 7.3c1.5 0 2.8-.3 4.2-1.2l-2-3.3c-.6.3-1.2.4-1.9.4-1.9 0-3.2-1.3-3.2-3.3 0-1.9 1.3-3.3 3.2-3.3.7 0 1.3.2 1.9.4z" fill="#ed0c3f"/></svg></div>
            <div class="brand-type"><span>CITIZEN</span><small>CHURCH <b>·</b> GROUPS</small></div>
          </div>
          <div class="header-buttons">
            <button class="circle-icon" type="button" data-action="activity" aria-label="View activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.8 7.8 0 0 1-8 8 9.3 9.3 0 0 1-3-.5l-5 2 1.8-4.5A7.8 7.8 0 0 1 4 11.5a8 8 0 0 1 16 0z"/></svg></button>
            <button class="circle-icon user-icon" type="button" data-tab="you" aria-label="Your profile">JW</button>
          </div>
        </header>
        <main class="content-scroll" id="content" tabindex="-1"></main>
        <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
      </div>
      <div id="sheet-root"></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
  </div>
</body>
</html>
