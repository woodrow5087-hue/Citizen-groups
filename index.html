<script id="intro-bootstrap">
/* A session-scoped brand intro, independent of the locally saved demo. */
(() => {
  'use strict';
  const key = 'citizen-connect-intro-seen-v1';
  const root = document.documentElement;
  try { if (sessionStorage.getItem(key) === '1') return; } catch { /* Still allow this visit. */ }
  root.dataset.intro = 'show';
  const theme = document.querySelector('meta[name="theme-color"]');
  const previousTheme = theme?.content;
  if (theme) theme.content = '#e6002f';
  document.addEventListener('DOMContentLoaded', () => {
    const intro = document.getElementById('app-intro');
    const screen = document.querySelector('.phone-screen');
    const main = document.getElementById('app-content');
    if (!intro || !screen) {
      root.removeAttribute('data-intro');
      if (theme) theme.content = previousTheme;
      return;
    }
    let dismissed = false;
    let autoTimer;
    screen.inert = true;
    function finish() {
      intro.hidden = true;
      root.removeAttribute('data-intro');
      if (theme) theme.content = previousTheme;
    }
    function dismiss(focusMain = false) {
      if (dismissed) return;
      dismissed = true;
      clearTimeout(autoTimer);
      document.removeEventListener('keydown', onKey);
      try { sessionStorage.setItem(key, '1'); } catch { /* No storage requirement. */ }
      screen.inert = false;
      root.dataset.intro = 'leaving';
      intro.inert = true;
      if (focusMain || document.activeElement === intro) main?.focus({preventScroll:true});
      if (window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) finish();
      else {
        intro.addEventListener('transitionend', event => {
          if (event.target === intro && event.propertyName === 'opacity') finish();
        }, {once:true});
        setTimeout(finish, 200); // Also releases the screen if a transition event is suppressed.
      }
    }
    function onKey(event) {
      if (['Escape','Enter',' '].includes(event.key)) {
        event.preventDefault();
        dismiss(true);
      }
    }
    intro.addEventListener('click', () => dismiss(true), {once:true});
    document.addEventListener('keydown', onKey);
    autoTimer = setTimeout(() => dismiss(), 1000);
  }, {once:true});
})();

</script>
