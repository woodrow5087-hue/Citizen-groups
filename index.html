<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dc001f">
  <meta name="application-name" content="Citizen Connect">
  <meta name="apple-mobile-web-app-title" content="Citizen Connect">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="An unofficial, device-local Citizen Connect leadership demo. All members and opportunities are fictional.">
  <title>Citizen Connect · Daily Rhythm Demo</title>
  <link rel="icon" href="assets/favicon.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=mobile-contrast-2">
  <script defer src="app.js?v=mobile-contrast-2"></script>
</head>
<body>
  <div class="stage">
    <div class="phone-shell">
      <div class="phone-camera" aria-hidden="true"></div>
      <div class="app-frame">
        <header class="app-header" id="header">
          <div class="brand">
            <img class="logo-base" src="assets/citizen-connect.png" width="160" height="52" alt="Citizen Connect"><img class="logo-connect" src="assets/citizen-connect.png" width="160" height="52" alt="" aria-hidden="true">
          </div>
          <div class="header-buttons">
            <button class="circle-icon" type="button" data-action="activity" aria-label="View activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 6-3 6-3 9h18c0-3-3-3-3-9M10 21h4"/></svg></button>
            <button class="circle-icon" type="button" data-action="profile" aria-label="Your profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3"/><path d="M5 19a7 7 0 0 1 14 0"/></svg></button>
          </div>
        </header>
        <main class="content-scroll" id="content" tabindex="-1"></main>
        <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
      </div>
      <div id="sheet-root"></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
  </div>
</body>
</html>
