name: Rally Point Preview QA

on:
  push:
    branches:
      - 'rally-point/v10-pilot-readiness'
      - 'rally-point/develop'
  pull_request:
    branches:
      - main
      - 'rally-point/develop'

permissions:
  contents: read

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and fixture flow tests
        run: npm test
      - name: Build static preview
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile, accessibility, source navigation and VersePlay regression
        run: npm run test:browser
      - name: Run animated onboarding → dashboard integration regression
        run: npm run test:onboarding
      - name: Run Blank Battle mobile gameplay and screenshot QA
        run: npm run test:blank-battle
      - name: Run F-03/F-04/F-08 Groups and storage-protection browser QA
        run: npm run test:groups-safety
      - name: Verify reused standalone Wednesday conversation experience
        run: npm run test:chat-lab
      - name: Verify Wednesday messaging inside canonical Groups and legacy archive
        run: npm run test:groups-integrated
      - name: Check the default Today on the Netlify preview build
        run: |
          CONTEXT=deploy-preview npm run build
          python3 -m http.server 8514 --bind 127.0.0.1 --directory dist &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --silent --fail --retry 5 --retry-connrefused http://127.0.0.1:8514/ -o /dev/null
          node scripts/preview-today-browser-check.mjs http://127.0.0.1:8514/
      - name: Save visual QA screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rally-point-preview-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
