name: Rally Point Preview QA

on:
  push:
    branches:
      - 'rally-point/v10-pilot-readiness'
      - 'rally-point/develop'
      - 'rally-one/develop'
  pull_request:
    branches:
      - main
      - 'rally-point/develop'
      - 'rally-one/develop'

permissions:
  contents: read

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and fixture flow tests
        run: npm test
      - name: Build static preview
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile, accessibility, source navigation and VersePlay regression
        run: npm run test:browser
      - name: Run animated onboarding → dashboard integration regression
        run: npm run test:onboarding
      - name: Run Blank Battle mobile gameplay and screenshot QA
        run: npm run test:blank-battle
      - name: Run F-03/F-04/F-08 Groups and storage-protection browser QA
        run: npm run test:groups-safety
      - name: Verify reused standalone Wednesday conversation experience
        run: npm run test:chat-lab
      - name: Verify Wednesday messaging inside canonical Groups and legacy archive
        run: npm run test:groups-integrated
      - name: Check the default Today on the Netlify preview build
        run: |
          CONTEXT=deploy-preview npm run build
          python3 -m http.server 8514 --bind 127.0.0.1 --directory dist &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --silent --fail --retry 5 --retry-connrefused http://127.0.0.1:8514/ -o /dev/null
          node scripts/leadership-demo-browser-check.mjs http://127.0.0.1:8514/
          node scripts/preview-today-browser-check.mjs http://127.0.0.1:8514/
          node scripts/s10c5-member-journeys-browser-check.mjs http://127.0.0.1:8514/
          node scripts/ux01e-browser-check.mjs http://127.0.0.1:8514/
          node scripts/ux02-browser-check.mjs http://127.0.0.1:8514/
          node scripts/ux03-browser-check.mjs http://127.0.0.1:8514/
          node scripts/ux03-profile-review.mjs http://127.0.0.1:8514/
      - name: Exercise isolated synthetic review lab (loopback only)
        run: node scripts/s11e-local-review-browser-check.mjs
      - name: Compare immutable PR 119 and owner-approved Read references
        run: |
          reference_dir="$RUNNER_TEMP/rally-one-approved-119"
          mkdir -p "$reference_dir"
          git fetch --depth=1 origin 5aa88c93c3d4cd22902ef98af98c09b74ca436ce
          git archive 5aa88c93c3d4cd22902ef98af98c09b74ca436ce | tar -x -C "$reference_dir"
          CONTEXT=deploy-preview node "$reference_dir/scripts/build.cjs"
          read_reference_dir="$RUNNER_TEMP/rally-one-approved-ux01"
          mkdir -p "$read_reference_dir"
          git fetch --depth=1 origin 4e3baa96cc10ab4b32cbaecb69d19098f05840c0
          git archive 4e3baa96cc10ab4b32cbaecb69d19098f05840c0 | tar -x -C "$read_reference_dir"
          CONTEXT=deploy-preview node "$read_reference_dir/scripts/build.cjs"
          premium_reference_dir="$RUNNER_TEMP/rally-one-approved-ux01e"
          mkdir -p "$premium_reference_dir"
          git fetch --depth=1 origin 16868e6c5f86d38c296e71bb6da8f94f32446028
          git archive 16868e6c5f86d38c296e71bb6da8f94f32446028 | tar -x -C "$premium_reference_dir"
          CONTEXT=deploy-preview node "$premium_reference_dir/scripts/build.cjs"
          adaptive_reference_dir="$RUNNER_TEMP/rally-one-approved-ux02"
          mkdir -p "$adaptive_reference_dir"
          git fetch --depth=1 origin ef4b8e7bfc2523d109da463b41c78c22ca40d1e9
          git archive ef4b8e7bfc2523d109da463b41c78c22ca40d1e9 | tar -x -C "$adaptive_reference_dir"
          CONTEXT=deploy-preview node "$adaptive_reference_dir/scripts/build.cjs"
          BROWSER_PATH="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')" node scripts/s8-visual-regression.mjs "$reference_dir/dist" "$read_reference_dir/dist" "$premium_reference_dir/dist" "$adaptive_reference_dir/dist"
      - name: Save visual QA screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rally-point-preview-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
