name: Rally Point Preview QA

on:
  push:
    branches:
      - 'rally-point/v10-pilot-readiness'
  pull_request:
    branches:
      - main
      - 'rally-point/v08-preferred-design-snapshot'

permissions:
  contents: read

concurrency:
  group: rally-point-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and fixture flow tests
        run: npm test
      - name: Build static preview
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile, accessibility, source navigation and VersePlay regression
        run: npm run test:browser
      - name: Run animated onboarding → dashboard integration regression
        run: npm run test:onboarding
      - name: Run Blank Battle mobile gameplay and screenshot QA
        run: npm run test:blank-battle

      # The user-approved v0.8 revision is a fixed visual specification.
      # Building from the commit (rather than comparing two moving branches)
      # prevents subsequent PRs from silently redefining the reference.
      - name: Check out approved v0.8 visual baseline
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'rally-point/v08-preferred-design-snapshot' }}
        uses: actions/checkout@v4
        with:
          ref: 84e489b86851e853948a7d4246475e83b7ddd085
          path: .release-baseline
      - name: Build approved visual baseline
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'rally-point/v08-preferred-design-snapshot' }}
        run: node .release-baseline/scripts/build.cjs
      - name: Check candidate against approved visual screens
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'rally-point/v08-preferred-design-snapshot' }}
        run: npm run test:visual

      - name: Save browser QA, visual diffs, and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rally-point-preview-qa
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
