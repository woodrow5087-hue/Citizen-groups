name: Alive Concept Lab QA

on:
  pull_request:
    branches:
      - 'rally-point/development-v08'
    paths:
      - 'alive-lab.*'
      - 'scripts/alive-lab-browser-check.mjs'
      - 'scripts/build.cjs'
      - 'test/alive-lab.test.cjs'
      - 'package.json'
      - '.github/workflows/alive-concept-lab-qa.yml'

permissions:
  contents: read

jobs:
  alive-lab-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all unit/behavior tests
        run: npm test
      - name: Build the standalone lab alongside approved v0.8
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise Today, Groups, interactions and accessibility
        run: npm run test:alive
      - name: Check the Netlify PR preview link (non-blocking)
        continue-on-error: true
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--citizen-connect-test.netlify.app/alive-lab.html
        run: |
          mkdir -p test-results/alive-lab
          echo "Expected PR preview: $PREVIEW_URL" | tee test-results/alive-lab/preview-status.txt
          for attempt in 1 2 3 4 5; do
            status=$(curl --location --silent --output /tmp/alive-page --write-out '%{http_code}' --connect-timeout 5 --max-time 12 "$PREVIEW_URL" || true)
            echo "Attempt $attempt: HTTP $status" | tee -a test-results/alive-lab/preview-status.txt
            if [ "$status" = "200" ] && grep -q 'Rally Point.*ALIVE concept lab' /tmp/alive-page; then
              echo "VERIFIED: The interactive lab is reachable at $PREVIEW_URL" | tee -a test-results/alive-lab/preview-status.txt
              exit 0
            fi
            sleep 8
          done
          echo "NOT VERIFIED YET: Use the Netlify preview link inside GitHub PR checks." | tee -a test-results/alive-lab/preview-status.txt
          exit 1
      - name: Save lab screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rally-point-alive-lab-qa
          path: test-results/alive-lab/
          if-no-files-found: ignore
          retention-days: 14
