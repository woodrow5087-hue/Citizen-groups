name: Read journey QA
on:
  pull_request:
    paths:
      - 'rallypoint.js'
      - 'rallypoint-read-*.css'
      - 'rallypoint-verseplay-ui.js'
      - 'rallypoint-memorize.js'
      - 'index.html'
      - 'scripts/build.cjs'
      - 'scripts/read-journey-browser-check.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/read-journey-qa.yml'
permissions:
  contents: read
jobs:
  read-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:read
      - name: Upload mobile screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: read-journey-debug
          path: test-results/
          if-no-files-found: ignore
